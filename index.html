<!DOCTYPE html>
<html>
<head>
    <title>Trovynx Studios</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: black;
            color: white;
            text-align: center;
        }

        .top {
            border-bottom: 3px solid gold;
            padding: 15px;
            color: gold;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        #books {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            padding: 30px;
        }

        .book {
            background: #1e1e1e;
            padding: 15px;
            width: 260px;
            border-radius: 15px;
            border: 1px solid #333;
            transition: transform 0.3s;
        }

        .book:hover {
            transform: translateY(-10px);
            border-color: gold;
        }

        button {
            padding: 12px;
            background: gold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 15px;
            font-size: 16px;
        }

        img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            border-radius: 10px;
            background: #333; /* Placeholder color while loading */
        }

        h3 {
            margin: 15px 0 5px 0;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="top">TROVYNX STUDIOS</div>

<h2 style="margin-top: 30px;">My Library</h2>

<div id="books">Loading books from the database...</div>

<script>
// This is your specific Sheet link formatted for CSV export
const sheetUrl = "https://docs.google.com/spreadsheets/d/1F3MnUAX8ZZl0T2X-QuasuWg0jl8LrH6ts5eIWUE4ho8/export?format=csv";

async function loadBooks() {
    try {
        const response = await fetch(sheetUrl);
        const data = await response.text();
        
        // Split data into rows
        const rows = data.split('\n');
        
        let html = '';

        // We start at i = 1 to skip the header row (Name, Image, Link)
        for (let i = 1; i < rows.length; i++) {
            // Split row by commas
            const columns = rows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            
            if (columns.length >= 3) {
                const name = columns[0].replace(/"/g, "").trim(); 
                const image = columns[1].replace(/"/g, "").trim();
                const link = columns[2].replace(/"/g, "").trim();

                if(name !== "") {
                    html += `
                    <div class="book">
                        <img src="${image}" alt="${name}" onerror="this.src='https://via.placeholder.com/260x380?text=No+Cover+Found'">
                        <h3>${name}</h3>
                        <a href="${link}" target="_blank">
                            <button>Read on BriBooks</button>
                        </a>
                    </div>
                    `;
                }
            }
        }
        
        document.getElementById('books').innerHTML = html || "No books found in the sheet!";

    } catch (error) {
        console.error("Error:", error);
        document.getElementById('books').innerHTML = "Error loading library. Make sure your Sheet is shared to 'Anyone with the link'!";
    }
}

loadBooks();
</script>

</body>
</html>
