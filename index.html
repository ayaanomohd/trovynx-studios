<!DOCTYPE html>
<html>
<head>
    <title>Trovynx Studios</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: black;
            color: white;
            text-align: center;
        }

        .top {
            background: black;
            border-bottom: 3px solid gold;
            padding: 15px;
            color: gold;
            font-size: 24px;
            font-weight: bold;
        }

        .book {
            background: #1e1e1e;
            margin: 20px auto;
            padding: 15px;
            width: 300px;
            border-radius: 15px;
        }

        input {
            margin: 5px;
            padding: 10px;
            width: 260px;
            border-radius: 8px;
            border: none;
        }

        button {
            padding: 10px 20px;
            background: gold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        img {
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="top">TROVYNX STUDIOS</div>

<h2>Add Book</h2>

<input id="name" placeholder="Book Name"><br>
<input id="image" placeholder="Image URL"><br>
<input id="link" placeholder="BriBooks Link"><br>

<button onclick="addBook()">Add Book</button>

<div id="books"></div>

<script>
window.addBook = function () {
    alert("Button works again ✔");

    let name = document.getElementById("name").value;
    let image = document.getElementById("image").value;
    let link = document.getElementById("link").value;

    let div = document.createElement("div");
    div.className = "book";

    div.innerHTML = `
        <img src="${image}">
        <h3>${name}</h3>
        <a href="${link}" target="_blank">
            <button>Read</button>
        </a>
    `;

    document.getElementById("books").appendChild(div);
};
</script>

</body>
</html>
