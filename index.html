<!DOCTYPE html>
<html>
<head>
    <title>Trovynx Studios</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: black;
            color: white;
            text-align: center;
        }

        .top {
            border-bottom: 3px solid gold;
            padding: 15px;
            color: gold;
            font-size: 24px;
        }

        .book {
            background: #1e1e1e;
            margin: 20px auto;
            padding: 15px;
            width: 300px;
            border-radius: 15px;
        }

        input {
            margin: 5px;
            padding: 8px;
            width: 250px;
        }

        button {
            padding: 10px;
            background: gold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        img {
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="top">TROVYNX STUDIOS</div>

<h2>Add Book</h2>

<input id="name" placeholder="Book Name"><br>
<input id="image" placeholder="Image URL"><br>
<input id="link" placeholder="Book Link"><br>

<button onclick="addBook()">Add Book</button>

<div id="books"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCzrfF88beuRBN5alpzw2Wly1MD7fizm0U",
  authDomain: "trovynx-studios.firebaseapp.com",
  projectId: "trovynx-studios",
  storageBucket: "trovynx-studios.firebasestorage.app",
  messagingSenderId: "224831240998",
  appId: "1:224831240998:web:64f0d13efbee3fe4c21fe7"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ADD BOOK
async function addBook() {

    let name = document.getElementById("name").value;
    let image = document.getElementById("image").value;
    let link = document.getElementById("link").value;

    if (!name || !image || !link) {
        alert("Fill all fields!");
        return;
    }

    await db.collection("books").add({
        name,
        image,
        link
    });

    alert("Saved ✔");

    loadBooks();
}

// LOAD BOOKS
async function loadBooks() {

    let snapshot = await db.collection("books").get();

    document.getElementById("books").innerHTML = "";

    snapshot.forEach(doc => {
        let b = doc.data();

        document.getElementById("books").innerHTML += `
        <div class="book">
            <img src="${b.image}">
            <h3>${b.name}</h3>
            <a href="${b.link}" target="_blank">
                <button>Read</button>
            </a>
        </div>
        `;
    });
}

// LOAD ON START
loadBooks();
</script>

</body>
</html>
