<!DOCTYPE html>
<html>
<head>
    <title>Trovynx Studios</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: black;
            color: white;
            text-align: center;
        }

        .top {
            background: black;
            border-bottom: 3px solid gold;
            padding: 15px;
            color: gold;
            font-size: 24px;
        }

        .book {
            background: #1e1e1e;
            margin: 20px auto;
            padding: 15px;
            width: 300px;
            border-radius: 15px;
        }

        input {
            margin: 5px;
            padding: 8px;
            width: 250px;
        }

        button {
            padding: 10px;
            background: gold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        img {
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="top">TROVYNX STUDIOS</div>

<h2>Add Book</h2>

<input id="name" placeholder="Book Name"><br>
<input id="image" placeholder="Image URL"><br>
<input id="link" placeholder="BriBooks Link"><br>

<button onclick="addBook()">Add Book</button>

<div id="books"></div>

<script>
console.log("SCRIPT LOADED ✔");

// LOCAL STORAGE (WORKING VERSION)
function addBook() {

    alert("BUTTON WORKS ✔");

    let name = document.getElementById("name").value;
    let image = document.getElementById("image").value;
    let link = document.getElementById("link").value;

    if (!name || !image || !link) {
        alert("Please fill all fields!");
        return;
    }

    let books = JSON.parse(localStorage.getItem("books") || "[]");

    books.push({ name, image, link });

    localStorage.setItem("books", JSON.stringify(books));

    loadBooks();
}

function loadBooks() {

    let books = JSON.parse(localStorage.getItem("books") || "[]");

    document.getElementById("books").innerHTML = "";

    books.forEach(b => {
        document.getElementById("books").innerHTML += `
        <div class="book">
            <img src="${b.image}">
            <h3>${b.name}</h3>
            <a href="${b.link}" target="_blank">
                <button>Read</button>
            </a>
        </div>
        `;
    });
}

loadBooks();
</script>

</body>
</html>
