<!DOCTYPE html>
<html>
<head>
    <title>Trovynx Studios</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: black;
            color: white;
            text-align: center;
        }

        .top {
            background: black;
            border-bottom: 3px solid gold;
            padding: 15px;
            color: gold;
            font-size: 24px;
        }

        .book {
            background: #1e1e1e;
            margin: 20px auto;
            padding: 15px;
            width: 300px;
            border-radius: 15px;
        }

        input {
            margin: 5px;
            padding: 8px;
            width: 250px;
        }

        button {
            padding: 10px;
            background: gold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        img {
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="top">TROVYNX STUDIOS</div>

<h2>Add Book</h2>

<input id="name" placeholder="Book Name"><br>
<input id="image" placeholder="Image URL"><br>
<input id="link" placeholder="Book Link"><br>

<button onclick="addBook()">Add Book</button>

<div id="books"></div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// 🔴 PASTE FRESH VALUES HERE
const supabaseUrl = "https://ylvvrslouwwjxxxqznvu.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlsdnZyc2xvdXd3anh4eHF6bnZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5ODUyNjgsImV4cCI6MjA5MTU2MTI2OH0.1ywVFQ0lYYOI8DLAMmKGMUVXiK1FQPWYMQfuRBnJK1o";

const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

// ADD BOOK
async function addBook() {

    let name = document.getElementById("name").value;
    let image = document.getElementById("image").value;
    let link = document.getElementById("link").value;

    let { error } = await supabase.from("books").insert([
        { name, image, link, likes: 0, views: 0 }
    ]);

    if (error) {
        alert("ERROR: " + error.message);
        return;
    }

    alert("Saved ✔");

    loadBooks();
}

// LOAD BOOKS
async function loadBooks() {

    let { data, error } = await supabase.from("books").select("*");

    if (error) {
        alert("LOAD ERROR: " + error.message);
        return;
    }

    document.getElementById("books").innerHTML = "";

    data.forEach((b) => {
        document.getElementById("books").innerHTML += `
        <div class="book">
            <img src="${b.image}">
            <h3>${b.name}</h3>
            <a href="${b.link}" target="_blank">
                <button>Read</button>
            </a>
        </div>
        `;
    });
}

// LOAD ON START
loadBooks();
</script>

</body>
</html>
